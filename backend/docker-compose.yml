services:
  postgres:
    image: postgres:16-alpine
    container_name: mailflow_postgres
    restart: unless-stopped
    ports:
      - '5433:5432'

    environment:
      POSTGRES_USER: mailflow
      POSTGRES_PASSWORD: mailflow
      POSTGRES_DB: mailflow
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U mailflow -d mailflow']
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: mailflow_redis
    restart: unless-stopped
    ports:
      - '6379:6379'
    # AOF persistence: every queued/delayed job survives a Redis restart.
    command: redis-server --appendonly yes --appendfsync everysec
    volumes:
      - redis_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
  redis_data:
