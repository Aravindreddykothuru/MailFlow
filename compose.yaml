services:
  postgres:
    image: postgres:16-alpine
    container_name: mailflow_postgres
    restart: unless-stopped
    ports:
      - '5433:5432'
    environment:
      POSTGRES_USER: mailflow
      POSTGRES_PASSWORD: mailflow
      POSTGRES_DB: mailflow
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U mailflow -d mailflow']
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: mailflow_redis
    restart: unless-stopped
    ports:
      - '6379:6379'
    command: redis-server --appendonly yes --appendfsync everysec
    volumes:
      - redis_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: mailflow_backend
    restart: unless-stopped
    ports:
      - '4000:4000'
    environment:
      PORT: 4000
      DATABASE_URL: postgresql://mailflow:mailflow@postgres:5432/mailflow
      REDIS_URL: redis://redis:6379
      FRONTEND_URL: http://localhost:3000
      JWT_SECRET: mailflow-production-secret-key-min-32-chars-jwt
      WORKER_CONCURRENCY: 3
      MIN_DELAY_MS: 2000
      MAX_EMAILS_PER_HOUR_PER_SENDER: 50
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: mailflow_worker
    restart: unless-stopped
    command: ["node", "dist/worker.js"]
    environment:
      DATABASE_URL: postgresql://mailflow:mailflow@postgres:5432/mailflow
      REDIS_URL: redis://redis:6379
      JWT_SECRET: mailflow-production-secret-key-min-32-chars-jwt
      WORKER_CONCURRENCY: 3
      MIN_DELAY_MS: 2000
      MAX_EMAILS_PER_HOUR_PER_SENDER: 50
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  frontend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: mailflow_frontend
    restart: unless-stopped
    ports:
      - '3000:3000'
    environment:
      NODE_ENV: production
      VITE_API_BASE_URL: http://localhost:4000
    depends_on:
      - backend

volumes:
  postgres_data:
  redis_data:
